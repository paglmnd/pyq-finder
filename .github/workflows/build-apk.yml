name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html app.js style.css data.json www/

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          pip install pillow
          python3 make_icons.py
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PYQ-Finder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PYQ-Finder-apk
          path: PYQ-Finder.apk

      - name: Publish / update the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest PYQ-Finder.apk --title "PYQ Finder (latest APK)" --notes "Auto-built from the latest commit. Download PYQ-Finder.apk and install it on your phone." --target "${GITHUB_SHA}"
